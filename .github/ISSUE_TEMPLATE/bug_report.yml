name: Bug report
description: Report a reproducible defect in qqbot-toolkit
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, access tokens, real OpenIDs, or private chat content.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Event mode
      options:
        - WebSocket
        - API only (no gateway)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Code sample or commands, with secrets removed.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / trace_id
      description: Remove tokens, OpenIDs and message content.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have removed credentials and personal data from this report.
          required: true
        - label: I have searched existing issues.
          required: true
