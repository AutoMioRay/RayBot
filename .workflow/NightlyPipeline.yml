# Gitee Go 流水线：夜间全量（长尾 Fuzz + 全量扫描）
#
# 触发：定时（每日 18:00，cron 为 Gitee Go 的 "M H D m d y" 六段格式，秒自动补）
# 或推送 nightly-* 标签手动触发。
#
# 与门禁流水线的差异：Fuzz 配额 500 → 10000，覆盖长尾输入；其余门禁相同。
# 注意：L4 长时稳定性测试（S4-03/08/10/11）不在此运行——云端有配额限制，
#       请用 `python tools/soak_test.py --minutes 1440` 在本地执行。
#
# 运行环境见 PRPipeline.yml 头部说明（自有主机组 shell@agent，Python 3.13）。
version: '1.0'
name: nightly
displayName: Nightly 全量安全测试
variables:
  CI_WORKSPACE: .
  PYTHON_BIN: python3
triggers:
  push:
    tags:
      prefix:
        - nightly-
  schedule:
    - cron: '0 18 * * ?'
stages:
  - stage:
      name: full
      displayName: 全量测试与扫描
      strategy: fast
      trigger: auto
      steps:
        - step: shell@agent
          name: full-gate
          displayName: Fuzz 10000 + 全量扫描
          hostGroupID: qqbot-ci
          script: |
            set -euo pipefail
            cd "${CI_WORKSPACE:-.}"
            "${PYTHON_BIN:-python3}" tools/ci/gate.py install
            "${PYTHON_BIN:-python3}" tools/ci/gate.py build
            "${PYTHON_BIN:-python3}" tools/ci/gate.py test --examples 10000
            "${PYTHON_BIN:-python3}" tools/ci/gate.py scan
