# Gitee Go 流水线：真实凭据连通性冒烟（仅手动/标签触发，永不用于 PR）
#
# 用途：token 获取 → 机器人资料 → 网关发现 → WebSocket READY 的真实链路验证。
# 前提（Gitee Go 控制台 → 流水线 → 变量设置）：
#   QQBOT_APP_ID        明文变量
#   QQBOT_CLIENT_SECRET 密文变量（仅授权给受保护标签/手动运行）
#
# 安全约束：
#   * 只能手动运行或在受保护标签上触发；PR 流水线不配置任何密文变量；
#   * 日志与产物均不落凭据（gate.py / smoke_test.py 已由专项测试保证）；
#   * 本流水线不产出制品，避免凭据进入构建缓存。
#
# 运行环境见 PRPipeline.yml 头部说明（自有主机组 shell@agent，Python 3.13）。
version: '1.0'
name: live-smoke
displayName: 手动连通性冒烟（真实凭据）
variables:
  CI_WORKSPACE: .
  PYTHON_BIN: python3
triggers:
  push:
    tags:
      prefix:
        - smoke-
stages:
  - stage:
      name: smoke
      displayName: 真实环境冒烟
      strategy: naturally
      trigger: manual
      steps:
        - step: shell@agent
          name: smoke
          displayName: token / 网关 / WebSocket READY
          hostGroupID: qqbot-ci
          script: |
            set -euo pipefail
            cd "${CI_WORKSPACE:-.}"
            "${PYTHON_BIN:-python3}" tools/ci/gate.py install
            "${PYTHON_BIN:-python3}" tools/ci/gate.py smoke
